name: Release pg-react adapter v0.47.0

on:
  pull_request:
    paths:
      - .github/workflows/v0.47.0-release.yml
      - .github/workflows/qualification.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - docker/**
      - docs/planning/EVIDENCE.md
      - docs/v0.47.0-release-notes.md
      - integrations/pg-mdm/**
      - plans/v0.47.0.md
      - showcase/mdm-stewardship/**
      - sql/**
      - src/**
      - tests/integrations/pg-mdm/**
      - tests/mdm_stewardship_contract.py
      - tests/qualification.sh
  workflow_dispatch:
  push:
    tags:
      - v0.47.0

permissions:
  contents: read

jobs:
  core_qualification:
    uses: ./.github/workflows/qualification.yml
    with:
      image: pg-react:v0.47.0-qualification
    secrets: inherit

  adapter_qualification:
    needs: core_qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: v0.46.0-qualified-candidate
          path: v0.46.0-evidence
      - name: Load the exact core image qualified for this commit
        env:
          IMAGE: pg-react:v0.47.0-qualification
        run: |
          set -euo pipefail
          sha256sum --check v0.46.0-evidence/candidate-image.SHA256SUMS
          docker load --input v0.46.0-evidence/candidate-image.tar.gz
          jq -e --arg commit "$GITHUB_SHA" \
            '.status != "failed" and .commit == $commit' \
            v0.46.0-evidence/evidence-manifest.json
          image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          test "$image_id" = "$(tr -d '\n' < v0.46.0-evidence/candidate-image.txt)"
          mkdir -p v0.47.0-release-evidence
          printf '%s\n' "$image_id" > v0.47.0-release-evidence/core-image-id.txt
      - name: Run adapter fixture and typed-flow qualification
        env:
          IMAGE: pg-react:v0.47.0-qualification
        run: |
          set -euo pipefail
          container=pg-react-v047
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" \
            --env POSTGRES_PASSWORD=qualification \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            "$IMAGE" postgres -c shared_preload_libraries=pg_trickle,pg_react >/dev/null
          for attempt in $(seq 1 60); do
            if docker logs "$container" 2>&1 | grep -F 'PostgreSQL init process complete' >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! docker logs "$container" 2>&1 | grep -F 'PostgreSQL init process complete' >/dev/null; then
            docker logs "$container"
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$container" pg_isready -U postgres
          if ! docker exec --env PGPASSWORD=qualification "$container" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -f /work/tests/integrations/pg-mdm/v0.47.sql \
            > v0.47.0-release-evidence/fixture.log 2>&1; then
            cat v0.47.0-release-evidence/fixture.log
            exit 1
          fi
          echo 'v0.47 fixture SQL: passed'
          if ! docker exec --env PGPASSWORD=qualification "$container" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -f /work/tests/integrations/pg-mdm/v0.47-typed.sql \
            > v0.47.0-release-evidence/typed-flow.log 2>&1; then
            cat v0.47.0-release-evidence/typed-flow.log
            exit 1
          fi
          echo 'v0.47 typed-flow SQL: passed'
      - name: Verify signed contract and live qualification evidence
        env:
          IMAGE: pg-react:v0.47.0-qualification
        run: |
          set -euo pipefail
          python3 tests/mdm_stewardship_contract.py \
            > v0.47.0-release-evidence/contract.log 2>&1
          echo 'MDM-STEWARDSHIP/1 contract: passed'
          jq -e '
            .release == "v0.47.0" and
            .status == "qualified_pilot" and
            .upstream.inspected_release == "pg-mdm v0.13.1 source tag (extension version 0.14.0)" and
            .environment.joint_live_stack == true and
            .numeric_limits.status == "approved_pilot" and
            .numeric_limits.required_workload_limits.target_review_cases == 100 and
            .numeric_limits.required_workload_limits.loaded_source_rows == 150 and
            .numeric_limits.required_workload_limits.initial_refresh_seconds_max == 54 and
            .numeric_limits.required_workload_limits.timestamp_only_single_row_refresh_seconds_max == 4 and
            (.blocked_gates | length) == 0 and
            all(.tests[]; (.status | startswith("passed")))
          ' tests/integrations/pg-mdm/evidence/v0.47.0/manifest.json
          cp tests/integrations/pg-mdm/evidence/v0.47.0/manifest.json \
            v0.47.0-release-evidence/live-qualification.json
          manifest_sha=$(sha256sum v0.47.0-release-evidence/live-qualification.json | awk '{print $1}')
          image_id=$(tr -d '\n' < v0.47.0-release-evidence/core-image-id.txt)
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg image "$IMAGE" \
            --arg image_id "$image_id" \
            --arg live_manifest_sha256 "$manifest_sha" \
            '{schema_version: 1, release: "v0.47.0", status: "passed", commit: $commit,
              workflow_run: $run, qualified_core_image: $image, core_image_id: $image_id,
              live_manifest_sha256: $live_manifest_sha256,
              tests: [
                {id: "core", status: "passed", workflow: "Canonical qualification"},
                {id: "fixture", status: "passed", log: "fixture.log"},
                {id: "typed_flow", status: "passed", log: "typed-flow.log"},
                {id: "contract", status: "passed", log: "contract.log"},
                {id: "live", status: "passed", manifest: "live-qualification.json"}
              ]}' \
            > v0.47.0-release-evidence/release-qualification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v0.47.0-release-evidence
          path: v0.47.0-release-evidence/

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.47.0'
    needs: adapter_qualification
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: v0.47.0-release-evidence
          path: v0.47.0-release-evidence
      - name: Verify tag and qualification evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/tags/v0.47.0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jq -e --arg commit "$GITHUB_SHA" \
            '.status == "passed" and .commit == $commit and .release == "v0.47.0"' \
            v0.47.0-release-evidence/release-qualification.json
          jq -e '.status == "qualified_pilot" and .numeric_limits.status == "approved_pilot"' \
            v0.47.0-release-evidence/live-qualification.json
      - name: Build source and evidence archives
        run: |
          set -euo pipefail
          artifact=pg-react-v0.47.0-adapter.tar.gz
          git archive --format=tar --prefix=pg-react-v0.47.0-adapter/ "$GITHUB_SHA" \
            LICENSE docs/v0.47.0-release-notes.md \
            integrations/pg-mdm/README.md integrations/pg-mdm/sql \
            integrations/pg-mdm/contract/README.md \
            contracts/MDM-STEWARDSHIP-1.json contracts/MDM-STEWARDSHIP-1-fixture.json \
            showcase/mdm-stewardship \
            tests/integrations/pg-mdm/v0.47.sql \
            tests/integrations/pg-mdm/v0.47-typed.sql \
            tests/integrations/pg-mdm/v0.47-live-setup.sql \
            tests/integrations/pg-mdm/v0.47-live.sql \
            tests/integrations/pg-mdm/evidence/v0.47.0/manifest.json \
            tests/mdm_stewardship_contract.py | gzip -n -9 > "$artifact"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C v0.47.0-release-evidence -cf - . | gzip -n -9 > pg-react-v0.47.0-evidence.tar.gz
          sha256sum "$artifact" pg-react-v0.47.0-evidence.tar.gz > pg-react-v0.47.0.SHA256SUMS
          sha256sum --check pg-react-v0.47.0.SHA256SUMS
      - name: Require unpublished release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '! gh release view v0.47.0 >/dev/null 2>&1'
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.47.0 \
            pg-react-v0.47.0-adapter.tar.gz \
            pg-react-v0.47.0-evidence.tar.gz \
            pg-react-v0.47.0.SHA256SUMS \
            --verify-tag --notes-file docs/v0.47.0-release-notes.md \
            --title 'pg-react MDM adapter 0.47.0'
